<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Apex Wealth Admin Execution Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: #111;
      color: white;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<h2>Apex Wealth — Admin Execution Test</h2>

<p>
  Temporary test page for the paper-trading execution workflow.
</p>

<input
  id="email"
  type="email"
  value="mendozavalerie275@gmail.com"
  placeholder="Admin email"
>

<input
  id="password"
  type="password"
  placeholder="Admin password"
>

<button onclick="login()">
  Sign In as Admin
</button>

<button onclick="executeOrder()">
  Execute AAPL Paper Order
</button>

<pre id="output">Loading...</pre>

<script>

const SUPABASE_URL =
  'https://ugplolnnklwiymryduii.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

const ORDER_ID =
  'b6281f82-1245-45bb-b8fc-f8ccd456b4d2';

let client = null;

function show(data) {
  document.getElementById('output').textContent =
    typeof data === 'string'
      ? data
      : JSON.stringify(data, null, 2);
}

window.addEventListener('load', () => {

  if (!window.supabase) {
    show({
      step: 'INIT',
      success: false,
      error: 'Supabase library did not load.'
    });
    return;
  }

  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  show({
    step: 'INIT',
    success: true,
    message: 'Supabase client ready.'
  });
});


async function login() {

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  show('Signing in as admin...');

  const { data, error } =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    show({
      step: 'LOGIN',
      success: false,
      error: error.message
    });
    return;
  }

  show({
    step: 'LOGIN',
    success: true,
    user_id: data.user.id,
    email: data.user.email,
    message: 'Admin authentication successful.'
  });
}


async function executeOrder() {

  show('Executing AAPL paper order...');

  const { data, error } =
    await client.rpc(
      'execute_order',
      {
        p_order_id: ORDER_ID,
        p_execution_price: 225.10,
        p_execution_quantity: 1,
        p_idempotency_key: 'TEST-AAPL-EXECUTION-001'
      }
    );

  if (error) {
    show({
      step: 'EXECUTION',
      success: false,
      error: error.message,
      details: error.details,
      hint: error.hint
    });
    return;
  }

  show({
    step: 'EXECUTION',
    success: true,
    execution_id: data,
    order_id: ORDER_ID,
    symbol: 'AAPL',
    side: 'buy',
    quantity: 1,
    execution_price: 225.10,
    total: 225.10
  });
}

</script>

</body>
</html>
