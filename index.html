<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Apex Wealth Admin Test</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
      line-height: 1.5;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: #1d1d1d;
      padding: 20px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #555;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #000;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Apex Wealth Admin Test</h2>

  <p>
    Temporary test page for the paper/virtual funding workflow.
  </p>

  <input
    id="email"
    type="email"
    value="mendozavalerie275@gmail.com"
    placeholder="Admin email"
  >

  <input
    id="password"
    type="password"
    placeholder="Admin password"
  >

  <button onclick="loginAdmin()">
    Sign In as Admin
  </button>

  <button onclick="approveFunding()">
    Approve $1,000 Virtual Deposit
  </button>

  <pre id="output">Loading...</pre>
</div>

<script>
  const SUPABASE_URL =
    'https://ugplolnnklwiymryduii.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

  const FUNDING_REQUEST_ID =
    '69802d8d-cd29-4a7a-b1c1-1e29e09fb316';

  let supabaseClient = null;

  function output(data) {
    document.getElementById('output').textContent =
      typeof data === 'string'
        ? data
        : JSON.stringify(data, null, 2);
  }

  function initializeSupabase() {
    try {
      if (!window.supabase) {
        throw new Error('Supabase library did not load.');
      }

      if (!window.supabase.createClient) {
        throw new Error('Supabase createClient is unavailable.');
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      output({
        step: "INIT",
        success: true,
        message: "Supabase client is ready."
      });

    } catch (error) {
      output({
        step: "INIT",
        success: false,
        error: error.message
      });
    }
  }

  async function loginAdmin() {

    if (!supabaseClient) {
      output({
        step: "LOGIN",
        success: false,
        error: "Supabase client is not ready."
      });
      return;
    }

    const email =
      document.getElementById('email').value.trim();

    const password =
      document.getElementById('password').value;

    if (!email || !password) {
      output({
        step: "LOGIN",
        success: false,
        error: "Enter the admin email and password."
      });
      return;
    }

    output("Signing in...");

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      output({
        step: "LOGIN",
        success: false,
        error: error.message
      });
      return;
    }

    output({
      step: "LOGIN",
      success: true,
      user_id: data.user?.id,
      email: data.user?.email
    });
  }

  async function approveFunding() {

    if (!supabaseClient) {
      output({
        step: "FUNDING_APPROVAL",
        success: false,
        error: "Supabase client is not ready."
      });
      return;
    }

    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    if (!sessionData.session) {
      output({
        step: "FUNDING_APPROVAL",
        success: false,
        error: "You must sign in as the admin first."
      });
      return;
    }

    output("Approving funding request...");

    const { data, error } =
      await supabaseClient.rpc(
        'admin_review_funding',
        {
          p_request_id: FUNDING_REQUEST_ID,
          p_status: 'approved'
        }
      );

    if (error) {
      output({
        step: "FUNDING_APPROVAL",
        success: false,
        error: error.message,
        details: error.details,
        hint: error.hint
      });
      return;
    }

    output({
      step: "FUNDING_APPROVAL",
      success: true,
      result: data,
      funding_request_id: FUNDING_REQUEST_ID
    });
  }

  window.addEventListener('load', initializeSupabase);
</script>

</body>
</html>
