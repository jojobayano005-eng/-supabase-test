<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Apex Wealth Paper Trading Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: #111;
      color: white;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<h2>Apex Wealth — Paper Trading Test</h2>

<input
  id="email"
  type="email"
  value="praiseboutique74@gmail.com"
  placeholder="Customer email"
>

<input
  id="password"
  type="password"
  placeholder="Customer password"
>

<button onclick="login()">
  Sign In
</button>

<button onclick="createAAPLOrder()">
  Create 1 AAPL Paper Buy @ $225.10
</button>

<pre id="output">Loading...</pre>

<script>

const SUPABASE_URL =
  'https://ugplolnnklwiymryduii.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

let client = null;

function show(data) {
  document.getElementById('output').textContent =
    typeof data === 'string'
      ? data
      : JSON.stringify(data, null, 2);
}

window.addEventListener('load', () => {

  if (!window.supabase) {
    show({
      step: 'INIT',
      success: false,
      error: 'Supabase library did not load.'
    });
    return;
  }

  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  show({
    step: 'INIT',
    success: true,
    message: 'Supabase client ready.'
  });
});


async function login() {

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  show('Signing in...');

  const { data, error } =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    show({
      step: 'LOGIN',
      success: false,
      error: error.message
    });
    return;
  }

  show({
    step: 'LOGIN',
    success: true,
    user_id: data.user.id,
    email: data.user.email
  });
}


async function createAAPLOrder() {

  show('Creating AAPL paper order...');

  const { data, error } =
    await client.rpc(
      'create_order',
      {
        p_symbol: 'AAPL',
        p_side: 'buy',
        p_quantity: 1,
        p_limit_price: 225.10,
        p_idempotency_key: 'TEST-AAPL-BUY-001',
        p_take_profit: null,
        p_stop_loss: null
      }
    );

  if (error) {
    show({
      step: 'CREATE_ORDER',
      success: false,
      error: error.message,
      details: error.details,
      hint: error.hint
    });
    return;
  }

  show({
    step: 'CREATE_ORDER',
    success: true,
    order_id: data
  });
}

</script>

</body>
</html>
