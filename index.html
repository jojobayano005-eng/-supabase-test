<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supabase Funding Test</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #eee;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Supabase Funding Test</h2>

  <input
    id="email"
    type="email"
    value="praiseboutique74@gmail.com"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button id="loginBtn" type="button">
    Sign In
  </button>

  <button id="fundBtn" type="button" disabled>
    Create $1,000 Virtual Deposit
  </button>

  <pre id="output">Loading...</pre>

</div>

<script>
const SUPABASE_URL =
  'https://ugplolnnklwiymryduii.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

let supabaseClient = null;

const output = document.getElementById('output');
const loginBtn = document.getElementById('loginBtn');
const fundBtn = document.getElementById('fundBtn');

function show(message) {
  output.textContent =
    typeof message === 'string'
      ? message
      : JSON.stringify(message, null, 2);
}

function startApp() {

  if (!window.supabase) {
    show({
      step: 'STARTUP',
      success: false,
      error: 'Supabase library did not load.'
    });
    return;
  }

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  show('Ready. Enter your password and tap Sign In.');
}

loginBtn.addEventListener('click', async function () {

  show('Signing in...');

  if (!supabaseClient) {
    show({
      step: 'LOGIN',
      success: false,
      error: 'Supabase client is not ready.'
    });
    return;
  }

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  if (!email || !password) {
    show({
      step: 'LOGIN',
      success: false,
      error: 'Email and password are required.'
    });
    return;
  }

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      show({
        step: 'LOGIN',
        success: false,
        error: error.message,
        details: error.details,
        hint: error.hint
      });
      return;
    }

    fundBtn.disabled = false;

    show({
      step: 'LOGIN',
      success: true,
      user_id: data.user.id,
      email: data.user.email
    });

  } catch (err) {

    show({
      step: 'LOGIN',
      success: false,
      error: String(err)
    });

  }

});

fundBtn.addEventListener('click', async function () {

  show('Creating $1,000 virtual funding request...');

  try {

    const { data, error } =
      await supabaseClient.rpc(
        'create_funding_request',
        {
          p_type: 'deposit',
          p_amount: 1000,
          p_currency: 'USD',
          p_idempotency_key: 'TEST-DEPOSIT-001',
          p_note: 'End-to-end paper funding test'
        }
      );

    if (error) {
      show({
        step: 'FUNDING_REQUEST',
        success: false,
        error: error.message,
        details: error.details,
        hint: error.hint
      });
      return;
    }

    show({
      step: 'FUNDING_REQUEST',
      success: true,
      funding_request_id: data
    });

  } catch (err) {

    show({
      step: 'FUNDING_REQUEST',
      success: false,
      error: String(err)
    });

  }

});

startApp();
</script>

</body>
</html>
