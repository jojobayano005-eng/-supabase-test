<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apex Wealth - Admin Funding Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #eee;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Apex Wealth — Admin Funding Test</h2>

  <p>
    This is a temporary test page for the paper/virtual funding workflow.
  </p>

  <input
    id="email"
    type="email"
    value="mendozavalerie275@gmail.com"
    placeholder="Admin email"
  >

  <input
    id="password"
    type="password"
    placeholder="Admin password"
  >

  <button id="loginBtn" type="button">
    Sign In as Admin
  </button>

  <button id="approveBtn" type="button" disabled>
    Approve $1,000 Virtual Deposit
  </button>

  <pre id="output">Loading...</pre>

</div>

<script>
const SUPABASE_URL =
  'https://ugplolnnklwiymryduii.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

const FUNDING_REQUEST_ID =
  '69802d8d-cd29-4a7a-b1c1-1e29e09fb316';

let supabaseClient = null;

const output =
  document.getElementById('output');

const loginBtn =
  document.getElementById('loginBtn');

const approveBtn =
  document.getElementById('approveBtn');

function show(message) {
  output.textContent =
    typeof message === 'string'
      ? message
      : JSON.stringify(message, null, 2);
}

function startApp() {

  if (!window.supabase) {
    show({
      step: 'STARTUP',
      success: false,
      error: 'Supabase library did not load.'
    });
    return;
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  show(
    'Ready. Sign in with the admin test account.'
  );
}

loginBtn.addEventListener(
  'click',
  async function () {

    show('Signing in as admin...');

    if (!supabaseClient) {
      show({
        step: 'LOGIN',
        success: false,
        error: 'Supabase client is not ready.'
      });
      return;
    }

    const email =
      document.getElementById('email')
        .value.trim();

    const password =
      document.getElementById('password')
        .value;

    if (!email || !password) {
      show({
        step: 'LOGIN',
        success: false,
        error: 'Email and password are required.'
      });
      return;
    }

    try {

      const { data, error } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });

      if (error) {
        show({
          step: 'LOGIN',
          success: false,
          error: error.message,
          details: error.details,
          hint: error.hint
        });
        return;
      }

      approveBtn.disabled = false;

      show({
        step: 'LOGIN',
        success: true,
        user_id: data.user.id,
        email: data.user.email,
        message: 'Authenticated admin session established.'
      });

    } catch (err) {

      show({
        step: 'LOGIN',
        success: false,
        error: String(err)
      });

    }
  }
);

approveBtn.addEventListener(
  'click',
  async function () {

    show(
      'Approving $1,000 virtual funding request...'
    );

    try {

      const { data, error } =
        await supabaseClient.rpc(
          'admin_review_funding',
          {
            p_request_id: FUNDING_REQUEST_ID,
            p_status: 'approved'
          }
        );

      if (error) {
        show({
          step: 'ADMIN_REVIEW_FUNDING',
          success: false,
          error: error.message,
          details: error.details,
          hint: error.hint
        });
        return;
      }

      show({
        step: 'ADMIN_REVIEW_FUNDING',
        success: true,
        result: data,
        funding_request_id: FUNDING_REQUEST_ID,
        message:
          'Funding request approval RPC completed successfully.'
      });

    } catch (err) {

      show({
        step: 'ADMIN_REVIEW_FUNDING',
        success: false,
        error: String(err)
      });

    }
  }
);

startApp();
</script>

</body>
</html>
