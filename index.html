<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Wealth - Execution Security Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h2>APEX WEALTH</h2>
<h3>Execution Security Test</h3>

<input
  id="email"
  type="email"
  value="praiseboutique74@gmail.com"
  placeholder="Email"
>

<br><br>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<br><br>

<button id="loginButton">
  Sign In
</button>

<button id="executeButton" disabled>
  Execute Existing AAPL Order
</button>

<pre id="output">Waiting...</pre>

<script>

const SUPABASE_URL =
  'https://ugplolnnklwiymryduii.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

const ORDER_ID =
  'e21f0440-1000-4fee-8ba1-9792d6284fca';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

const output =
  document.getElementById('output');

const executeButton =
  document.getElementById('executeButton');


function show(data) {
  output.textContent =
    JSON.stringify(data, null, 2);
}


// ================================
// SIGN IN
// ================================

document
  .getElementById('loginButton')
  .addEventListener('click', async function () {

    show({
      step: 'LOGIN',
      status: 'Signing in...'
    });

    const email =
      document.getElementById('email')
        .value
        .trim();

    const password =
      document.getElementById('password')
        .value;

    if (!email || !password) {

      show({
        step: 'LOGIN',
        success: false,
        error: 'Email and password are required.'
      });

      return;
    }

    try {

      const result =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (result.error) {

        show({
          step: 'LOGIN',
          success: false,
          error: result.error.message
        });

        return;
      }

      executeButton.disabled = false;

      show({
        step: 'LOGIN',
        success: true,
        user_id: result.data.user.id,
        email: result.data.user.email,
        message:
          'Customer authentication successful. Execute button enabled.'
      });

    } catch (err) {

      show({
        step: 'LOGIN',
        success: false,
        error: err.message
      });

    }

  });


// ================================
// EXECUTE EXISTING ORDER
// ================================

executeButton
  .addEventListener('click', async function () {

    show({
      step: 'EXECUTION',
      status: 'Attempting execution...'
    });

    try {

      const sessionResult =
        await supabaseClient.auth.getSession();

      if (
        sessionResult.error ||
        !sessionResult.data.session
      ) {

        show({
          step: 'EXECUTION',
          success: false,
          error: 'No authenticated session.'
        });

        return;
      }


      const result =
        await supabaseClient.rpc(
          'execute_order',
          {
            p_order_id: ORDER_ID,
            p_execution_price: 225.10,
            p_execution_quantity: 1,
            p_idempotency_key:
              'SECURITY-TEST-CUSTOMER-001'
          }
        );


      if (result.error) {

        show({
          step: 'EXECUTION',
          success: false,
          error: result.error.message,
          details:
            result.error.details || null,
          hint:
            result.error.hint || null
        });

        return;
      }


      show({
        step: 'EXECUTION',
        success: true,
        execution_id: result.data,
        message:
          'Customer was able to execute the order.'
      });

    } catch (err) {

      show({
        step: 'EXECUTION',
        success: false,
        error: err.message
      });

    }

  });

</script>

</body>
</html>
