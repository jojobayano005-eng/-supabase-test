<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Apex Wealth Admin Execution Test</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: #111;
      color: white;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<h2>Apex Wealth — Admin Execution Test</h2>

<input
  id="email"
  type="email"
  value="mendozavalerie275@gmail.com"
  placeholder="Admin email"
>

<input
  id="password"
  type="password"
  placeholder="Admin password"
>

<button id="loginBtn">
  Sign In as Admin
</button>

<button id="executeBtn" disabled>
  Execute AAPL Paper Order
</button>

<pre id="output">Starting...</pre>

<script>

const SUPABASE_URL =
  'https://ugplolnnklwiymryduii.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

let supabaseClient = null;

const output =
  document.getElementById('output');

const loginBtn =
  document.getElementById('loginBtn');

const executeBtn =
  document.getElementById('executeBtn');

const ORDER_ID =
  'b6281f82-1245-45bb-b8fc-f8ccd456b4d2';


function show(message) {

  output.textContent =
    typeof message === 'string'
      ? message
      : JSON.stringify(message, null, 2);

}


function startApp() {

  if (!window.supabase) {

    show({
      step: 'STARTUP',
      success: false,
      error: 'Supabase JavaScript library did not load.'
    });

    return;
  }

  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    show({
      step: 'STARTUP',
      success: true,
      message: 'Supabase client is ready.'
    });

  } catch (error) {

    show({
      step: 'STARTUP',
      success: false,
      error: String(error)
    });

  }

}


loginBtn.addEventListener(
  'click',
  async function () {

    if (!supabaseClient) {

      show({
        step: 'LOGIN',
        success: false,
        error: 'Supabase client is not ready.'
      });

      return;
    }

    const email =
      document.getElementById('email')
        .value
        .trim();

    const password =
      document.getElementById('password')
        .value;

    if (!email || !password) {

      show({
        step: 'LOGIN',
        success: false,
        error: 'Email and password are required.'
      });

      return;
    }

    show('Signing in as admin...');

    try {

      const result =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      const data = result.data;
      const error = result.error;

      if (error) {

        show({
          step: 'LOGIN',
          success: false,
          error: error.message,
          details: error.details,
          hint: error.hint
        });

        return;
      }

      executeBtn.disabled = false;

      show({
        step: 'LOGIN',
        success: true,
        user_id: data.user.id,
        email: data.user.email,
        message: 'Admin authentication successful.'
      });

    } catch (error) {

      show({
        step: 'LOGIN',
        success: false,
        error: String(error)
      });

    }

  }
);


executeBtn.addEventListener(
  'click',
  async function () {

    show('Executing AAPL paper order...');

    try {

      const result =
        await supabaseClient.rpc(
          'execute_order',
          {
            p_order_id: ORDER_ID,
            p_execution_price: 225.10,
            p_execution_quantity: 1,
            p_idempotency_key:
              'TEST-AAPL-EXECUTION-001'
          }
        );

      const data = result.data;
      const error = result.error;

      if (error) {

        show({
          step: 'EXECUTION',
          success: false,
          error: error.message,
          details: error.details,
          hint: error.hint
        });

        return;
      }

      show({
        step: 'EXECUTION',
        success: true,
        execution_id: data,
        order_id: ORDER_ID,
        symbol: 'AAPL',
        side: 'buy',
        quantity: 1,
        execution_price: 225.10,
        total: 225.10
      });

    } catch (error) {

      show({
        step: 'EXECUTION',
        success: false,
        error: String(error)
      });

    }

  }
);


if (
  document.readyState === 'loading'
) {

  document.addEventListener(
    'DOMContentLoaded',
    startApp
  );

} else {

  startApp();

}

</script>

</body>
</html>
