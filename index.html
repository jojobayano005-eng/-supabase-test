<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Wealth — Order Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>APEX WEALTH</h1>

<input
  id="email"
  type="email"
  value="praiseboutique74@gmail.com"
  placeholder="Email"
>

<br><br>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<br><br>

<button id="login">
  Sign In
</button>

<button id="order">
  Test Create AAPL Order
</button>

<pre id="output">Waiting...</pre>


<script>

const SUPABASE_URL =
  'https://ugplolnnklwiymryduii.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_2es_s2SFatFs0WrOC6ipnw_pqwyfIW1';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


function show(data) {

  document.getElementById('output').textContent =
    JSON.stringify(data, null, 2);

}


// ============================================================
// LOGIN
// ============================================================

document
  .getElementById('login')
  .addEventListener('click', async function () {

    show({
      step: 'LOGIN',
      status: 'Attempting login...'
    });


    const email =
      document.getElementById('email').value.trim();

    const password =
      document.getElementById('password').value;


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        show({
          step: 'LOGIN',
          success: false,
          error: error.message
        });

        return;
      }


      show({
        step: 'LOGIN',
        success: true,
        user_id: data.user.id,
        email: data.user.email
      });

    }

    catch (err) {

      show({
        step: 'LOGIN',
        success: false,
        error: err.message
      });

    }

  });


// ============================================================
// CREATE ORDER TEST
// ============================================================

document
  .getElementById('order')
  .addEventListener('click', async function () {

    show({
      step: 'CREATE_ORDER',
      status: 'Checking session...'
    });


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        show({
          step: 'CREATE_ORDER',
          success: false,
          error: error.message
        });

        return;
      }


      if (!data.session) {

        show({
          step: 'CREATE_ORDER',
          success: false,
          error: 'No authenticated session.'
        });

        return;
      }


      const idempotencyKey =
        'HARDENING-TEST-' + Date.now();


      show({
        step: 'CREATE_ORDER',
        status: 'Calling create_order()...',
        user_id: data.session.user.id,
        idempotency_key: idempotencyKey
      });


      const result =
        await supabaseClient.rpc(
          'create_order',
          {
            p_symbol: 'AAPL',
            p_side: 'buy',
            p_quantity: 1,
            p_limit_price: 225.10,
            p_idempotency_key: idempotencyKey,
            p_take_profit: null,
            p_stop_loss: null
          }
        );


      if (result.error) {

        show({
          step: 'CREATE_ORDER',
          success: false,
          error: result.error.message,
          details: result.error.details || null,
          hint: result.error.hint || null
        });

        return;
      }


      show({
        step: 'CREATE_ORDER',
        success: true,
        order_id: result.data
      });

    }

    catch (err) {

      show({
        step: 'CREATE_ORDER',
        success: false,
        error: err.message
      });

    }

  });

</script>

</body>
</html>
